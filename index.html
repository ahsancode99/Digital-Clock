<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>

  <div class="clock">

    <div class="upper">
        <span class="digits" id="hour">00 :</span>
        <span class="digits" id="min">00 :</span>
        <span class="digits" id="sec">00</span>
      </div>

      <span class="amPm" id="ampm">am/pm</span>

    <div class="lower">
        <span class="lower_digits" id="day">00</span>
        <span class="lower_digits" id="month">00</span>
        <span class="lower_digits" id="date">00</span>
    </div>

  </div>






    <script src="./app.js"></script>
</body>
</html>
